<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولد أكواد التفعيل - حلال أبو خالد</title>
<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f4;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
}
.box{
  width:min(600px,90%);
  margin-top:70px;
  background:white;
  padding:35px;
  border-radius:22px;
  box-shadow:0 8px 25px #0002;
  text-align:center;
}
h1{color:#10583f}
input{
  width:90%;
  padding:18px;
  font-size:22px;
  text-align:center;
  border:1px solid #ccc;
  border-radius:12px;
  margin:15px 0;
}
button{
  background:#10583f;
  color:white;
  border:0;
  border-radius:12px;
  padding:16px 25px;
  font-size:20px;
  cursor:pointer;
}
#result{
  margin-top:25px;
  font-size:24px;
  font-weight:bold;
  direction:ltr;
  word-break:break-all;
}
</style>
</head>
<body>

<div class="box">
  <h1>🔐 مولد أكواد التفعيل</h1>
  <p>حلال أبو خالد</p>

  <input id="device" value="" autocomplete="off" placeholder="ضع رقم الجهاز هنا">

  <br>

  <button onclick="makeCode()">إنشاء كود التفعيل</button>

  <div id="result"></div>
</div>

<script>

  function hash32(s){
 let h=2166136261;
 for(let i=0;i<s.length;i++){
  h^=s.charCodeAt(i);
  h=Math.imul(h,16777619);
 }
 return (h>>>0).toString(16).toUpperCase();
}

const LICENSE_SECRET="ABUKHALID-TRB-2026-X7";

function codeFor(dev,period){
 return (hash32(LICENSE_SECRET+"|"+dev+"|"+period)+"-"+hash32(period+"|"+dev+"|"+LICENSE_SECRET)).slice(0,17);
}

function currentQuarter(d=new Date()){
 return d.getFullYear()+"Q"+(Math.floor(d.getMonth()/3)+1);
}

function makeCode(){
 const device=document.getElementById("device").value.trim().toUpperCase();

 if(!device){
  alert("أدخل رقم الجهاز");
  return;
 }

 let period=currentQuarter(new Date());

 let code=codeFor(device,period);

 document.getElementById("result").textContent=code;
}

  
    

  

  

  
    
    
  

  

  
  

  

  

</script>

</body>
</html>
